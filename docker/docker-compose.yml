services:
  # 1. Сервер баз данных MySQL 8
  db:
    image: mysql:8.0
    container_name: yii2_mysql
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # 2. Контейнер обработки PHP (FPM)
  php:
    image: yiisoftware/yii2-php:8.2-fpm
    container_name: yii2_php
    restart: always
    env_file: .env
    volumes:
      # Монтируем папки на уровень выше относительно docker-compose.yml
      - ../app:/app
      - ../migrations:/migrations
    depends_on:
      - db

  # 3. Веб-сервер Nginx
  nginx:
    image: nginx:alpine
    container_name: yii2_nginx
    restart: always
    ports:
      - "${APP_PORT}:80"
    volumes:
      # Путь к коду на уровень выше, путь к конфигу локальный
      - ../app:/app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  db_data:
